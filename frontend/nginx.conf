# Serve o frontend compilado e repassa a API, as fotos e o tempo real
# (socket.io) para o container "backend" — o mesmo papel que o proxy do Vite
# faz em desenvolvimento (ver vite.config.js).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de produto: o backend aceita até 5 MB, o padrão do nginx é 1 MB.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker. Com isto o nginx sobe mesmo que o backend ainda
    # não esteja pronto, e reencontra o backend se ele for recriado.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3333;

    # HTTP/1.1 com o backend (conexão persistente). Sem isto o nginx fala
    # HTTP/1.0 com "Connection: close" e, quando o backend recusa uma
    # requisição antes de ler o corpo (sessão expirada, foto grande demais...),
    # ele fecha a conexão no meio do envio e o usuário recebe 502 em vez do
    # erro certo (401, 413...).
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Tempo real (KDS, mapa de mesas, ruptura de estoque): precisa do upgrade
    # para WebSocket, senão o socket.io cai no modo lento (polling).
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Arquivos do build têm hash no nome: podem ficar em cache "pra sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: qualquer outro caminho (/admin/dashboard, /login...) é
    # tela do próprio React, então devolve o index.html.
    location / {
        try_files $uri /index.html;
    }
}
